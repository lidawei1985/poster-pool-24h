name: scrape

on:
  schedule:
    - cron: "7 */2 * * *"   # 每 2 小时一轮（避开整点高峰）
  workflow_dispatch:
    inputs:
      pages:
        description: "每源抓取页数"
        default: "6"
      hero_batch:
        description: "横版主视觉尝试数"
        default: "15"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests Pillow

      - name: Run one scrape cycle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/run_cycle.py \
            --pages "${{ github.event.inputs.pages || 6 }}" \
            --hero-batch "${{ github.event.inputs.hero_batch || 15 }}" \
            --img-batch 120 --minutes 38

      - name: Commit pools & feeds
        run: |
          git config user.name "pool-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A pools feeds state
          if git diff --cached --quiet; then
            echo "Nothing new this cycle."
          else
            git commit -m "scrape: $(date -u '+%Y-%m-%d %H:%M') pools+feeds"
            git pull --rebase --autostash origin main
            git push
          fi
